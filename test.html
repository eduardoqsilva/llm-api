<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM API Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    #chat {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 15px;
      min-height: 400px;
      margin-bottom: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .user {
      font-weight: bold;
    }

    .assistant {
      margin-top: 5px;
    }

    .reasoning {
      color: #777;
      font-size: 14px;
      border-left: 3px solid #ccc;
      padding-left: 10px;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      box-sizing: border-box;
      padding: 10px;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
    }

    #status {
      color: #666;
      font-size: 13px;
      margin: 8px 0;
    }

    #imageRow {
      margin-top: 8px;
    }

    #imagePreview {
      max-width: 200px;
      max-height: 200px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h1>LLM API Test</h1>

  <div id="chat"></div>

  <div id="status"></div>

  <textarea
    id="input"
    placeholder="Digite sua mensagem..."
  ></textarea>

  <br>

  <label>
    <input type="checkbox" id="thinking" checked>
    Mostrar pensamento
  </label>

  <br>

  <div id="imageRow">
    <input type="file" id="image" accept="image/*">
    <button id="clearImage" type="button" hidden>Remover imagem</button>
  </div>

  <img id="imagePreview" hidden alt="Preview">

  <br>

  <button id="send">Enviar</button>

  <script>
    const API_URL = "http://localhost:3000/v1/chat/completions";
    const API_TOKEN = "abc123-super-secret";
    const MODEL = "model.gguf";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const thinkingCheckbox = document.getElementById("thinking");
    const status = document.getElementById("status");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const clearImageButton = document.getElementById("clearImage");

    const messages = [];

    function readImageAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getImageDataUrl() {
      if (!imageInput.files || imageInput.files.length === 0) {
        return null;
      }

      return imagePreview.src || null;
    }

    function clearImage() {
      imageInput.value = "";
      imagePreview.src = "";
      imagePreview.hidden = true;
      clearImageButton.hidden = true;
    }

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files?.[0];

      if (!file) {
        return;
      }

      const dataUrl = await readImageAsDataUrl(file);

      imagePreview.src = dataUrl;
      imagePreview.hidden = false;
      clearImageButton.hidden = false;
    });

    clearImageButton.addEventListener("click", clearImage);

    function addUserMessage(content) {
      const container = document.createElement("div");
      container.className = "message";

      container.innerHTML = `
        <div class="user">Você:</div>
        <div>${escapeHtml(content)}</div>
      `;

      chat.appendChild(container);
      chat.scrollTop = chat.scrollHeight;
    }

    function createAssistantMessage() {
      const container = document.createElement("div");
      container.className = "message";

      const reasoning = document.createElement("div");
      reasoning.className = "reasoning";

      const content = document.createElement("div");
      content.className = "assistant";

      container.innerHTML = `<div class="user">Modelo:</div>`;

      container.appendChild(reasoning);
      container.appendChild(content);

      chat.appendChild(container);

      return {
        container,
        reasoning,
        content
      };
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function sendMessage() {
      const text = input.value.trim();
      const imageDataUrl = getImageDataUrl();

      if (!text && !imageDataUrl) {
        return;
      }

      input.value = "";
      sendButton.disabled = true;

      const content = imageDataUrl
        ? [
            {
              type: "image_url",
              image_url: { url: imageDataUrl }
            },
            ...(text
              ? [{ type: "text", text }]
              : [])
          ]
        : text;

      addUserMessage(text || "[imagem enviada]");

      messages.push({
        role: "user",
        content
      });

      clearImage();

      const assistant = createAssistantMessage();

      status.textContent = "Gerando...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Authorization": `Bearer ${API_TOKEN}`,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            model: MODEL,
            messages,
            stream: true,
            thinking: thinkingCheckbox.checked
          })
        });

        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }

        if (!response.body) {
          throw new Error("A API não retornou um stream.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";
        let fullContent = "";

        while (true) {
          const { done, value } = await reader.read();

          if (done) {
            break;
          }

          buffer += decoder.decode(value, {
            stream: true
          });

          const lines = buffer.split("\n");

          buffer = lines.pop() || "";

          for (const line of lines) {
            const trimmed = line.trim();

            if (!trimmed) {
              continue;
            }

            if (!trimmed.startsWith("data:")) {
              continue;
            }

            const data = trimmed.slice(5).trim();

            if (data === "[DONE]") {
              continue;
            }

            try {
              const chunk = JSON.parse(data);

              const delta = chunk.choices?.[0]?.delta;

              if (!delta) {
                continue;
              }

              if (delta.reasoning_content) {
                assistant.reasoning.textContent +=
                  delta.reasoning_content;
              }

              if (delta.content) {
                fullContent += delta.content;
                assistant.content.textContent = fullContent;
              }

              chat.scrollTop = chat.scrollHeight;

            } catch (error) {
              console.warn(
                "Chunk SSE inválido:",
                data
              );
            }
          }
        }

        /*
         * Guardamos a resposta no histórico para a próxima
         * mensagem.
         */
        messages.push({
          role: "assistant",
          content: fullContent
        });

        status.textContent = "Pronto.";

      } catch (error) {
        console.error(error);

        assistant.content.textContent =
          "Erro: " + error.message;

        status.textContent = "Erro.";

      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
  </script>

</body>
</html>
